<!DOCTYPE html><html lang="en"><head><title></title><link rel="icon" href="data:image/x-icon;base64"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;padding:0;font-family:"helvetica","arial",sans-serif}h1,h2,h3,h4,h5,h6,p{font-family:"helvetica","arial",sans-serif}#Product_Support,#Supervisor_Service_Manager,#Sales_Support,#Sales,#Coordinator,#Customer_Solutions,#Manager,#Parts_and_Warehouse,#Workshop_Trades_Person,#Field_Service_Trades_Person,#Other_Opportunities,#Team_Leader,#Resident_Field_Service_Trades_Person,#Apprentice,#Technical_Trainer{transition:all .5s ease-in-out}#Product_Support .st1,#Supervisor_Service_Manager .st1,#Sales_Support .st1,#Sales .st1,#Coordinator .st1,#Customer_Solutions .st1,#Manager .st1,#Parts_and_Warehouse .st1,#Workshop_Trades_Person .st1,#Field_Service_Trades_Person .st1,#Other_Opportunities .st1,#Team_Leader .st1,#Resident_Field_Service_Trades_Person .st1,#Apprentice .st1,#Technical_Trainer .st1{fill:#ccc}#Product_Support.clickable,#Supervisor_Service_Manager.clickable,#Sales_Support.clickable,#Sales.clickable,#Coordinator.clickable,#Customer_Solutions.clickable,#Manager.clickable,#Parts_and_Warehouse.clickable,#Workshop_Trades_Person.clickable,#Field_Service_Trades_Person.clickable,#Other_Opportunities.clickable,#Team_Leader.clickable,#Resident_Field_Service_Trades_Person.clickable,#Apprentice.clickable,#Technical_Trainer.clickable{cursor:pointer}#Product_Support.clickable path,#Supervisor_Service_Manager.clickable path,#Sales_Support.clickable path,#Sales.clickable path,#Coordinator.clickable path,#Customer_Solutions.clickable path,#Manager.clickable path,#Parts_and_Warehouse.clickable path,#Workshop_Trades_Person.clickable path,#Field_Service_Trades_Person.clickable path,#Other_Opportunities.clickable path,#Team_Leader.clickable path,#Resident_Field_Service_Trades_Person.clickable path,#Apprentice.clickable path,#Technical_Trainer.clickable path{transition:all .25s ease-in-out;fill:#000}#Product_Support.clickable:hover path,#Supervisor_Service_Manager.clickable:hover path,#Sales_Support.clickable:hover path,#Sales.clickable:hover path,#Coordinator.clickable:hover path,#Customer_Solutions.clickable:hover path,#Manager.clickable:hover path,#Parts_and_Warehouse.clickable:hover path,#Workshop_Trades_Person.clickable:hover path,#Field_Service_Trades_Person.clickable:hover path,#Other_Opportunities.clickable:hover path,#Team_Leader.clickable:hover path,#Resident_Field_Service_Trades_Person.clickable:hover path,#Apprentice.clickable:hover path,#Technical_Trainer.clickable:hover path{fill:#fdba12}.full{width:98vw;height:100vh;margin:0 auto -100vh;display:flex;justify-content:center;overflow:hidden;align-items:center}video{width:1920px;height:1080px;max-width:100%;z-index:-10}.titles svg{width:1920px;height:1080px;max-width:100%}#shroud{display:none;background:hsla(0,0%,100%,.6);justify-content:center;align-items:center;position:relative;z-index:100}#shroud.active{display:flex}#jobs-summary{min-width:50vw;display:none;background:#fdba12;color:#000}#jobs-summary.active{display:block}#jobs-summary a{text-decoration:none}#jobs-summary .data-category-title,#jobs-summary ul.data-job-list{list-style-type:none;margin:20px;padding:0}#jobs-summary .data-category-title li,#jobs-summary ul.data-job-list li{list-style:none;display:block;margin-bottom:4px;padding:4px 10px 4px 4px}#jobs-summary .data-category-title li:hover,#jobs-summary ul.data-job-list li:hover{background:#000;color:#fff;cursor:pointer}#jobs-summary p{margin:0 20px}#jobs-summary .title-bar{padding:10px}#job-details{display:none;flex-direction:column;color:#000;min-width:500px;max-height:80vh}#job-details.active{display:flex}@media(min-width: 1200px){#job-details{max-width:60vw}}#job-details .title-bar{padding:20px}#job-details .contain{background:#fdba12;padding:10px 40px 40px 40px;clip-path:polygon(0 0, 100% 0, 100% calc(100% - 40px), calc(100% - 40px) 100%, 0% 100%);height:40vh;overflow:scroll}.title-bar{background:#000;color:#fff;display:flex;justify-content:space-between;align-items:start}.title-bar h1,.title-bar h4,.title-bar p{margin:2px 2px 2px 0;padding:2px 2px 2px 0}.title-bar .stack{flex:1}.title-bar .stack .row .position{display:flex}.actions{display:flex;justify-content:space-evenly;align-items:center}.actions button{display:flex;flex-direction:column;flex:1;color:hsla(0,0%,100%,.6666666667);text-transform:uppercase;background:none;border:1px solid hsla(0,0%,100%,.2666666667);border-radius:3px;margin:3px;padding:5px 10px;font-size:.8em}.actions button img,.actions button svg{height:16px}</style><script>let posting_data=[{Category:"Apprentice",JobTitle:"Dual Trade Apprentice Diesel Technician & Auto Electrician",Description:"<p>You will be signing up to a five-year apprenticeship, where you will receive first class training in the servicing, diagnosis, and maintenance of a massive range of Cat equipment and components. You will become a part of our Operations team and learn from some of the best in the business.</p><p>You will work with state-of-the-art technology and support services and be part of a dealer network that is one of the world&rsquo;s top 100 recognised brands. Upon completion you will receive two nationally accredited training qualifications, paid for by William Adams.<p>In addition, you will receive:</p><p><li>A subsidised toolkit worth over $6000 </li></p><p><li>A Caterpillar passport which allows you to work for any Cat dealer around the world</li></p><p><li> A full uniform including personal protective equipment (PPE) </li></p><p><li> Above award wages and opportunities to earn more with reasonable overtime</li></p>",Hours:"Full time - Monday to Friday &ndash; various rosters available.",Rates:"<p>Full time - Monday to Friday &ndash; various rosters available.</p>",Requirements:"<p>You will have a positive, customer focused attitude and a desire to learn, grow and be at the top of your game. You will be able to demonstrate your genuine interest and passion for your chosen trade/s and how it contributes to the heavy machinery industry.</p><p>Your positive attitude towards safety, excellent listening, and communication skills (both written and verbal) and your commitment to the structured training will not only see you succeed but thrive in our business.</p>",Advancement:"<p>Opportunities are endless. To name a few &hellip; Field Service Technician / Supervisor / Parts Advisor / Sales or Product Support Rep / Technical Trainer / Branch Manager&hellip; an apprenticeship at William Adams can take you anywhere!</p>"},{Category:"Apprentice",JobTitle:"Apprentice Boilermaker",Description:"<p>You will be signing up to a four-year apprenticeship, where you will receive first class training in heavy fabrication and welding work on a massive range of Cat equipment and components. You will become a part of our Operations team and learn from some of the best in the business. You will be working with state-of-the-art technology and support services and be part of a dealer network that is one of the world&rsquo;s top 100 recognised brands. Upon completion you will receive a nationally accredited training qualification, paid for by William Adams. In addition, you will receive:</p><ul><li>A subsidised toolkit worth over $6,000<li></li>A Caterpillar passport which allows you to work for any</li><li>Cat dealer around the world</li><li>A full uniform including personal protective equipment (PPE)</li><li>Above award wages and opportunities to earn more with reasonable overtime</li>",Hours:"<p>Full time &ndash; Monday to Friday &ndash; various rosters available.</p>",Rates:"<p>Above award hourly rate dependent on age and prior learning + overtime + leave loading.</p>",Requirements:"<p>You will have a positive, customer focused attitude and a desire to learn, grow and be at the top of your game. You will be able to demonstrate your genuine interest and passion for your chosen trade and how it contributes to the heavy machinery industry.</p><p>Your positive attitude towards safety, excellent attention to detail and communication skills (both written and verbal) and your commitment to the structured training will not only see you succeed but thrive in our business.</p>",Advancement:"<p>Opportunities are endless. To name a few, Dual Trade Diesel Technician / Team Leader / Supervisor / Sales or Product Support Rep / Branch Manager. An apprenticeship at William Adams can take you anywhere!</p>"},{Category:"Apprentice",JobTitle:"Apprentice Machinist",Description:"<p>You will be signing up to a four-year apprenticeship, where you will receive first class training in machining, using a broad range of CNC and other types of machinery. You will learn how to recondition a range of components as per Caterpillar reuse and salvage guidelines, to keep rebuild and operation costs down for our customers. You will become a part of our Operations team and learn from some of the best in the business.</p><p>You will be working with state-of-the-art technology and support services and be part of a dealer network that is one of the world&rsquo;s top 100 recognised brands. Upon completion you will receive a nationally accredited training qualification, paid for by William Adams.</p><p>In addition, you will receive:<ul><li>A subsidised toolkit worth over $6,000</li><li>A Caterpillar passport which allows you to work for any Cat dealer around the world</li><li>A full uniform including personal protective equipment (PPE)</li><li>Above award wages and opportunities to earn more with reasonable overtime</li></ul>",Hours:"<p>Full time &ndash; Monday to Friday &ndash; various rosters available.</p>",Rates:"<p>Above award hourly rate dependent on age and prior learning + overtime + leave loading.</p>",Requirements:"<p>You will have a positive, customer focused attitude and a desire to learn, grow and be at the top of your game. You will be able to demonstrate your genuine interest and passion for your chosen trade and how it contributes to the heavy machinery industry. Your positive attitude towards safety, excellent listening, and communication skills (both written and verbal) and your commitment to the structured training will not only see you succeed but thrive in our business.</p>",Advancement:"<p>Opportunities are endless. To name a few, Dual Trade Diesel Technician / Team Leader / Supervisor / Parts Interpreter / Branch Manager. An apprenticeship at William Adams can take you anywhere!</p>"},{Category:"Coordinator",JobTitle:"Coordinators",Description:"<p>You will become part of our Operations team where you will support our customers and Technicians, by coordinating services and repairs for our customers Cat equipment and components.</p><p>You will own the customer contact for all jobs from start to finish and work closely with the Service team to ensure smooth and efficient planning. You will provide quotations, schedule work, and manage invoicing.</p><p>Strong communication is critical, and your ultimate aim is to achieve customer satisfaction and value for money.</p>",Roles:["Coordinator &ndash; New Equipment","Customer Service & Uptime Coordinator (proactive coordinator)","Customer Service Coordinator (Field Service & Workshop based)","Equipment Service Planner (planned maintenance)","Inbound/Outbound Coordinator"],Hours:"<p>Full time with varied and flexible hours of work available.</p>",Rates:"<p>Competitive base salary + super + various benefits & rewards.</p>",Requirements:"<p>You will be an excellent communicator with experience working in a similar coordination type role. Your time management and multitasking skills are exceptional, and you have the drive and passion to deliver first class customer service.</p><p>You will ideally have experience or exposure to working in the heavy machinery or automotive industry and be able to demonstrate your diagnostics and problem-solving skills.</p>",Advancement:"<p>Opportunities are endless. To name a few, WIP Room Coordinator / Service Supervisor / Sales or Product Support Rep / Service Manager</p>"},{Category:"Coordinator",JobTitle:"Field Service Coordinator",Description:"You will become part of our Operations team where you will support our customers and Technicians by coordinating the same day, breakdown repair services for our customer&rsquo;s onsite Cat equipment and components.</p><p>You will own the customer contact for all jobs from start to finish and work closely with the Service Supervisor to ensure smooth and efficient planning. Strong communication is critical, and your ultimate aim is to achieve customer satisfaction and value for money.",Hours:"<p>Full time with varied and flexible hours of work available.</p>",Rates:"<p>Competitive base salary based on roster + super + various benefits & rewards.</p>",Requirements:" You will be an excellent communicator with experience working under pressure and have proven conflict resolution abilities. Your time management and multitasking skills are exceptional, and you have the drive and passion to deliver first class customer service</p><p>You will ideally have experience or exposure to working in the heavy machinery or automotive industry and be able to demonstrate your diagnostics and problem-solving skills.",Advancement:"<p>Opportunities are endless. To name a few, Field Service Supervisor / Sales or Product Support Rep / Service Manager / Product Support Manager &ndash; Metro Field Service / Branch Manager</p>"},{Category:"Customer Solutions",JobTitle:"Laboratory Technician ",Description:"<p>You will become a part of our Customer Solutions team, working in our SOS Laboratory. You will specialise in testing and analysing oil samples to assess their quality, performance and condition, ensuring the reliability of our customers&rsquo; machinery.</p><p>You will collect and prepare oil samples, conduct tests to evaluate properties like viscosity and contamination, and use specialised instruments to assess equipment health.</p><p>You will partner closely with the Condition Monitoring team who provide maintenance recommendations, ultimately supporting predictive maintenance programs and helping our customers optimise machinery performance, reduce maintenance costs and prevent unexpected equipment failures.</p>",Hours:"<p>Full-time with varied and flexible hours of work available. </p>",Rates:"<p>Competitive base salary + super + various benefits and rewards.</p>",Requirements:"<p>You will require a Bachelor of Science (Chemistry preferred) or equivalent, experience in a similar oil analysis laboratory, plus a Cert III (or higher) in Laboratory Skills.</p>",Advancement:"<p>Opportunities are endless. To name a few &hellip; Senior Laboratory Technician / Quality Laboratory Technician / Laboratory Supervisor / Condition Monitoring Advisor.</p>"},{Category:"Customer Solutions",JobTitle:"Condition Monitoring Advisor",Description:"<p>This role will see you working in the Customer Solutions team, by providing an overall health analysis on our customers (internal and external) machines. You will give recommendations and insights based on information gathered from condition monitoring sources such as SOS fluid analysis, electronic fault codes and data, and asset inspections.</p>",Hours:"<p>Full time with varied and flexible hours of work available.</p>",Rates:"<p>Competitive base salary + super + mobile phone + various benefits & rewards.</p>",Requirements:"<p>To perform this role, you will require either a mechanical trade qualification or equivalent technical experience.</p>",Advancement:"<p>You can move within the Customer Solutions team into roles such as a Technical Communicator, or you can move up into role in management within the wider CSG team or another department in the business</p>"},{Category:"Customer Solutions",JobTitle:"Condition Monitoring Interpreter",Description:"<p>You will work as part of the SOS Lab team in providing Interpretation of oil samples and provide advice to our customers so that they can make informed decisions in relation to their machines. You will also offer support to the SOS Lab technician team.</p>",Hours:"<p>Full time with varied and flexible hours of work available.</p>",Rates:"<p>Competitive base salary + super + various benefits & rewards.</p>",Requirements:"<p>To perform this role, you will require either a mechanical trade qualification or equivalent technical experience. Another pathway is having a Chemical qualification or Laboratory experience.</p>",Advancement:"<p>You can move to a Condition Monitoring Advisor role, where you get to hone your skills and deal with the next level of interpretation, or you can go to work in the SOS Lab dealing with the samples and analysis as it comes in (you may need some further study to do this). There are also options to move into the Technical Communicator role, where you can offer advice and guidance to our workshop and field teams.</p>"},{Category:"Customer Solutions",JobTitle:"Technical Communicator",Description:"<p>In this role your primary focus is to provide technical advice and assistance to both internal and external customers. You will be accountable for technical problem investigation and resolution for William Adams technicians (workshop and field), members of the product support team and external customers.</><p>You will be part of a team that provides in depth technical support to ensure our customers&rsquo; equipment is kept healthy and productive.</p>",Hours:"<p>Full time with varied and flexible hours of work available.</p>",Rates:"<p>Competitive base salary + super + mobile phone + various benefits & rewards.</p>",Requirements:"<p>You must have strong mechanical aptitude to perform this role. Ideally you will possess a trade or engineering qualification. Along with 10 + years of industry and/or technical related experience.</p>",Advancement:"<p>You could move into a product support sales role, or you could move into operational management.</p>"},{Category:"Customer Solutions",JobTitle:"Customer Solutions",Description:"<p>Our Customer Solutions team provides a range of tailored equipment and technological solutions to meet the unique needs of our customers. You will work closely with our loyal customers to improve productivity, reduce operating costs, and optimize fleet performance.</p>",Roles:["Technical Services Supervisor","CSA Coordinator","Customer Support Representative","Customer Value Agreement Coordinator","Customer Value Agreement Manager","Laboratory Services Manager","SOS Laboratory Supervisor"]},{Category:"Field Service Trades Person",JobTitle:"Field Service Diesel Technician",Description:"<p>You will become part of our Operations team, where you will work autonomously in providing the same day, diagnosis, servicing, and maintenance repair services for our customer&rsquo;s onsite Cat equipment and components.</p><p>You will have the opportunity to troubleshoot and diagnose some of the most technologically advanced machines. You will be working with state-of-the-art technology and support services and be part of a dealer network that is one of the world&rsquo;s top 100 recognised brands. </p> ",Hours:"<p>Full time with varied flexible roster options and hours available.</p>",Rates:"<p>Attractive hourly rate dependent on skill level and roster + overtime + leave loading + tool allowance (+ various other allowances for mine sites, after hours on call etc.) + mobile phone + vehicle.</p>",Requirements:"<p>You will be a qualified Diesel Technician with a positive, customer focused attitude. You will have some experience working in the field on Cat machinery and be able to demonstrate your expert diagnostic and problem-solving skills</p><p>You will maintain your own company vehicle, work autonomously to manage your time, and maximise efficiency, and collaborate effectively with our internal service and parts department. </p>",Advancement:"<p>Opportunities are endless. To name a few &hellip; Field Service Supervisor / Parts Advisor / Service Coordinator / Sales or Product Support Rep / Technical Communicator / Branch Manager</p>"},{Category:"Field Service Trades Person",JobTitle:"Field Service Auto Electrician ",Description:"<p>You will become part of our Operations team, where you will work autonomously to provide the same day, diagnosis, servicing, and maintenance of electrical and air conditioning systems on a massive range of Cat equipment.</p><p>You will be working with state-of-the-art technology and support services and be part of a dealer network that is one of the world&rsquo;s top 100 recognised brands.</p>",Hours:"<p>Full time with varied flexible roster options and hours available.</p>",Rates:"<p>Attractive hourly rate dependent on skill level and roster + overtime + leave loading + tool allowance (+ various other allowances for mine sites, after hours on call etc.) + mobile phone + vehicle.</p>",Requirements:"<p>You will be a qualified Auto Electrician with a positive, customer focused attitude. You will have experience working in the field on Cat machinery and be able to demonstrate your expertise electrical diagnostics and problem-solving skills.</p><p>You will maintain your own company vehicle, work autonomously to manage your time, and maximise efficiency, and collaborate effectively with our internal service and parts department. </p>",Advancement:"<p>Opportunities are endless. To name a few &hellip; Field Service Supervisor / Parts Advisor / Service Coordinator / Sales or Product Support Rep / Technical Trainer / Branch Manager</p>"},{Category:"Field Service Trades Person",JobTitle:"Field Service A Grade Electrician",Description:"<p>You will become part of our Operations team, where you will work autonomously to provide the same day, diagnosis, servicing, and maintenance of Caterpillar power generation systems, as well as industrial, stationary, and marine engines.</p> <p>You will be working with state-of-the-art technology and support services and be part of a dealer network that is one of the world&rsquo;s top 100 recognised brands.</p>",Hours:"<p>Full time with varied flexible roster options and hours available.</p>",Rates:"<p>Attractive hourly rate dependent on skill level and roster + overtime + leave loading + tool allowance (+ various other allowances for mine sites, after hours on call etc.) + mobile phone + vehicle.</p>",Requirements:"<p>You will be a qualified A Grade Electrician with a positive, customer focused attitude. You will have experience working in the field on Cat machinery and be able to demonstrate your expertise electrical diagnostics and problem-solving skills.</p><p>You will maintain your own company vehicle, work autonomously to manage your time, maximise efficiency, and collaborate effectively with our internal service and parts department.</p>",Advancement:"<p>Opportunities are endless. To name a few, Field Service Supervisor / Parts Interpreter / Service Coordinator / Sales or Product Support Rep / Technical Trainer / Branch Manager</p>"},{Category:"Field Service Trades Person",JobTitle:"Equipment Service Specialist",Description:"<p>You will become part of our Operations team, where you will work autonomously in performing preventative maintenance servicing, routine inspections, and minor repairs for our customer&rsquo;s Cat equipment onsite.</p><p>You will be working with state-of-the-art technology and support services and be part of a dealer network that is one of the world&rsquo;s top 100 recognised brands.</p>",Hours:"<p>Full time with varied flexible roster options and hours available.</p>",Rates:"<p>Attractive hourly rate dependent on skill level and roster + overtime + leave loading + tool allowance (+ various other allowances for mine sites, after hours on call etc.) + mobile phone + vehicle.</p>",Requirements:"<p>You will be a qualified Automotive or Diesel Mechanic with a positive, customer focused attitude.</p> <p>You will maintain a company vehicle, work autonomously to manage your time, maximise efficiency, and collaborate effectively with our internal service and parts department.</p>",Advancement:"<p>Opportunities are endless. To name a few, Diesel Technician / Parts Advisor / Service Coordinator / Sales or Product Support Rep / Technical Communicator</p>"},{Category:"Manager",JobTitle:"Managers/Leaders",Description:"<p>Across William Adams, we have various management roles that are responsible for focusing on strategic growth, operational excellence, and customer-centric leadership within the business. They prioritise sustainable practices, aligning operations with Caterpillar innovations, and fostering a high-performance culture.</p>",Roles:["Managing Director","Chief Financial Officer","General Managers in Operations/Product Support/Sales/People, Safety & Culture","Chief Digital Officer","Operations Managers","Branch Managers","Service Support Manager ","Customer Solutions Manager","Parts Inventory & Logistics Manager","Equipment Sales Manager","Operations Finance Support Manager","Product Manager","Sales & Purchasing Manager &ndash; Rental & Used"]},{Category:"Other Opportunities",JobTitle:"Marketing",Description:"<p>Our Marketing team shapes our brand identity and connects with our loyal and prospective customers. They process customer and equipment data to create ads and content, manage accounts, and handle customer information responsibly. Using these insights, they develop campaigns, work with other teams, and create engaging material to highlight what William Adams and Caterpillar offer.</p>",Roles:["Marketing Manager","Customer Intelligence Lead","Marketing Communications Lead","Brand and Communications Coordinator","Customer Intelligence Analyst"]},{Category:"Other Opportunities",JobTitle:"Business Improvement Group",Description:"<p>Our Business Improvement Group (BIG) implements changes in the business, from new systems or technology implementations to process improvement. The aim is to continuously enhance our services, customer experience, and work environment.</p><p>BIG oversees a range of strategic projects across all departments, ensuring they are completed on time and within budget. This team of skilled project managers supports the business in driving change. In this department, you will help define the scope, timeline, resources, and budget needed for successful project implementation.</p>",Roles:["Business Improvement Group Manager","Business Improvement Project Manager"]},{Category:"Other Opportunities",JobTitle:"Information Services",Description:"<p>The Information Services (IS) team is vital to our organisation's operations, ensuring the seamless functioning of our technology systems. With a highly skilled team, their primary focus is to support business objectives by delivering essential services, including:</p><p><ul><li>Infrastructure Management: Maintaining and upgrading hardware and software systems, including servers, networks, and workstations.</li><li>Technical Support: Assisting employees with IT-related issues, troubleshooting problems, and providing timely solutions.</li><li>Data Security: Implementing robust security measures to protect sensitive data from cyber threats and unauthorised access.</li><li>Network Management: Ensuring reliable and efficient network connectivity for all employees.</li><li>Software Development and Maintenance: Creating and maintaining custom software applications to meet specific business needs.</li><li>Business Continuity Planning: Developing and implementing strategies to minimise disruption in case of system failures or disasters.</li></ul></p>"},{Category:"Other Opportunities",JobTitle:"Technology Application Specialist",Description:"<p>You will become part of our Operations team, where you will be a strong contributor to the overall customer experience by delivering technical support and training around Caterpillar construction technology products.</p><p>This is a fast-developing area of our business and will see you discussing technology solutions with internal stakeholders, and new and existing customers. Some examples of the types of Caterpillar technology products are Grade, Payload, Machine Control, Productivity, and Safety.</p>",Hours:"<p>Full-time with varied and flexible hours of work available.</p>",Rates:"<p>Competitive base salary + super + vehicle + mobile phone + various benefits & rewards.</p>",Requirements:"<p>You have a passion for technology in this space and ideally have experience in a similar role and industry. If you have a surveying background this is highly advantageous.</p><p>You enjoy providing exceptional customer service and can build rapport with people quickly and naturally.</p>",Advancement:"<p>Opportunities are endless. To name a few &hellip; Product Support Sales Rep / Product Support Sales Supervisor / Technology & Innovation Manager / Customer Solutions Manager.</p>"},{Category:"Other Opportunities",JobTitle:"Learning & Development",Description:"<p>Our Learning & Development (L&D) Team is dedicated to fostering professional growth and building skills that align with both individual and organisational goals. </p><p>This experienced team plays a key role in designing and delivering training programs across various areas, including technical skills, soft skills, leadership, and compliance. In addition, they offer career development resources such as mentorship, coaching, and personalised development plans, while preparing employees for future leadership roles through targeted training.</p><p>Our L&D team also identifies skill gaps to enhance performance, boosts job satisfaction and retention by creating growth opportunities, and assesses training effectiveness to ensure learning objectives are achieved.",Roles:["Technical Training Manager","Technical Trainer","Learning & Capability Lead","Learning & Development Administrator"]},{Category:"Other Opportunities",JobTitle:"Health, Safety, Environment, and Quality",Description:"<p>Our Health, Safety, Environment, and Quality (HSEQ) team plays a critical role in fostering a strong safety culture at William Adams, ensuring our operations are safe, sustainable, and efficient through collaboration with all departments.</p><p>By promoting positive safety attitudes, the team's primary goal is to reduce workplace risks, prevent incidents, safeguard employees, and improve overall productivity. They ensure compliance with environmental regulations, working to minimise our environmental impact while identifying opportunities for greater sustainability.</p><p>Additionally, the SEQ frameworks focus on quality management, driving continuous improvements in processes, products, and services to enhance both customer satisfaction and operational performance.",Roles:["HSEQ Manager","HSEQ Advisor","Quality Assurance Coordinator","Health Safety & Environment Administration Assistant"]},{Category:"Other Opportunities",JobTitle:"People & Culture ",Description:"<p>Our People & Culture team is dedicated to managing and nurturing the organisation&rsquo;s most important asset &ndash; our people! Their responsibilities span from talent acquisition and onboarding to employee development and performance management, ensuring a positive and growth-oriented environment. They also focus on employee engagement and well-being, designing competitive compensation and benefits, and promoting diversity, equity, and inclusion (DEI).</p>",Roles:["People & Culture Manager","People & Culture Business Partner","People & Culture Advisor","People & Culture Administrator","Payroll Manager","Senior Payroll Officer","Payroll Officer","People & Culture Systems Manager","Talent Acquisition Manager","Talent Acquisition Specialist","Onboarding & Talent Acquisition Coordinator","Injury Management & Wellbeing Specialist"]},{Category:"Other Opportunities",JobTitle:"Finance",Description:"<p>Our Finance team provide support to both internal and external customers by maintaining strong financial systems and processes that safeguard the business, ensure accurate financial reporting, and enhance decision-making.</p><p>The team emphasises governance and business partnering structured around several key areas including;</p><p><ul><li>Accounts Payable: Manages supplier payments.</li><li>Accounts Receivable: Oversees customer credit terms and collections.</li><li>Systems Accounting: Ensures the reliability of core financial and reporting systems.</li><li>Accounting: Compiles financial statements, prepares tax returns, and manages cash liquidity.</li><li>Business Partnering: Provides information and analysis to aid strategic decision-making.</li><li>Procurement: Sources goods and services at optimal prices</li></ul>"},{Category:"Other Opportunities",JobTitle:"Service Support",Description:"<p>You will join our Operations department and be part of our centralised service support team, working closely with and providing support to both our Service Operations and Product Support teams across the organisation.</p><p>This team is made up of skilled professionals who specialise in the following key areas:</p><p><ul><li>Work In Progress: Manages all aspects of opening and closing of work orders to drive consistency, quality and reduce average days to invoice.</li><li>Warranty: Manage Cat warranty claims and process non-warranty service work orders.</li><li>Service Quoting: Build repair quotes for Product Support Reps and the service teams to present to customers.</li><li>Systems Support: Maintains the helpdesk for systems used by Service Departments.</li></ul>",Roles:["Service Support Manager","Service Support Coordinator","Warranty & Service Systems Supervisor","Warranty Analyst","Warranty Coordinator","Service Systems Support Officer","WIP Room Team Leader","Senior WIP Coordinator","WIP Coordinator","Repair Options Coordinator","Service Quoting Coordinator"]},{Category:"Other Opportunities",JobTitle:"Technology Sales Consultant",Description:"<p>You will become part of our Operations Team, where you will be a strong contributor to the overall customer experience by rolling out sales initiatives around new and existing Caterpillar technology products.</p><p>This is a fast-developing area of our business and will see you discussing technology solutions with internal stakeholders, and new and existing customers. You will research and provide solutions to meet specific customer requirements in the digital and technology space.</p><p>Some examples of the types of technology products are Grade, Payload, Machine Control, Surveillance and Security guidance as well as MineStar systems.</p>",Hours:"<p>Full time with varied and flexible hours of work available.</p>",Rates:"<p>Competitive base salary + super + vehicle + mobile phone + various benefits & rewards.</p>",Requirements:"<p>You have a passion for technology in this space and ideally have experience in a similar role and industry. If you have a surveying background this is highly advantageous.</p><p>You enjoy providing exceptional customer service and can build rapport with people quickly and naturally.</p><p>Your excellent written and verbal communication skills, along with your strong time management skills will ensure your success in this role.</p>",Advancement:"<p>Opportunities are endless. To name a few &hellip; Product Support Sales Rep / Equipment Sales Manager / Technology & Innovation Manager</p>"},{Category:"Other Opportunities",JobTitle:"Inventory",Description:"<p>Our Inventory team is a centralised department responsible for ensuring the availability of genuine Cat parts, merchandise, workshop consumables, and non-Cat vendor products across all branches in Victoria and Tasmania. They are a team of experienced expeditors and planners who collaborate closely with other departments, including warehouses sales, and service teams, to supply parts for rebuilds, maintenance kits, as well as manage escalations.</p>",Roles:["Product & Inventory Manager Parts Exchange","Transport & Logistics Manager","Parts Inventory & Procurement Manager","Team Leader Senior Inventory Planner","Parts Expeditor Inventory","Inventory Planner","Inventory Administration Coordinator"]},{Category:"Other Opportunities",JobTitle:"Administration",Description:"With a range of Administration roles across the business, you will provide vital administrative assistance to departments across the organisation, ensuring smooth day-to-day operations and consistent service delivery.",Roles:["Branch Administrator/Credit Officer","Branch Administrator","Receptionist","Service Administrator","Data Entry Administrator","Executive Assistant","Used Equipment Office Administrator","Contract Administrator","Claims Administrator"]},{Category:"Other Opportunities",JobTitle:"Digital",Description:"<p>You will keep our customers connected to products and services that enable them to increase efficiency and reduce costs. As part of our Digital team, you&rsquo;ll work closely with our Sales and Product Support Representatives to deliver solutions to our customers using the latest technology to help them keep their equipment running.</p><p>You will connect our customers to the online world of Parts.Cat.Com, work directly with Caterpillar, other Dealerships, and our internal customers to ensure the online experience is seamless for our customers.</p>",Roles:["Digital Applications Lead","Digital Applications Coordinator","Connectivity Solutions Coordinator","Ecommerce Manager"]},{Category:"Other Opportunities",JobTitle:"Technology and Innovation Manager",Description:"<p>You will drive the strategic planning and execution of machine connectivity and technology adoption initiatives within the dealership, with a strong focus on supporting customers in enhancing their equipment management, productivity, safety, and sustainability.</p><p>You will also be responsible for building and maintaining strong partnerships between William Adams and Caterpillar.</p>",Roles:["Digital Applications Lead","Digital Applications Coordinator","Connectivity Solutions Coordinator","Ecommerce Manager"],Hours:"<p>Full time - Monday to Friday.</p>",Rates:"<p>Competitive base salary + super + various benefits & rewards.</p>",Requirements:"<p>You will require strong technical knowledge, leadership capabilities, and customer-focused experience.</p>",Advancement:"<p>Opportunities are endless. To name a few, Digital Applications Lead / Product Support Sales Manager / Customer Solutions Manager / Branch Manager</p>"},{Category:"Parts and Warehouse",JobTitle:"Storeperson",Description:"<p>You will become part of our Warehouse team where you will be responsible for a range of warehouse and customer service duties aimed at ensuring the efficient operation of the store. This will include accurately picking and packing parts orders, organising freight shipments, fabrication of hoses, as well as receipt and storage of stock.</p><p>You will safely operate forklifts and use correct manual handling procedures to load and unload freight, while maintaining a clean and organised warehouse environment.</p>",Hours:"<p>Full-time with varied and flexible hours of work available.</p>",Rates:"<p>Above award hourly rate dependent on experience + overtime.</p>",Requirements:"<p>You have experience in a similar role where you have used RF guns and forklifts while picking and packing high volumes. Your strong communication skills help you work effectively within a collaborative team and ensure we meet our customers&rsquo; needs. You can handle multiple tasks simultaneously in a timely manner, ensuring you maintain high attention to detail and accuracy standards.</p>",Advancement:"<p>Opportunities are endless. To name a few &hellip; Team Leader / Warehouse Supervisor / Warehouse Manager / Parts Advisor.</p>"},{Category:"Parts and Warehouse",JobTitle:"Parts Supervisor / Manager",Description:"<p>You&rsquo;ll be part of our Operations team, playing a key role in supervising daily parts operations. This includes ensuring all shifts are properly staffed to handle phone and counter traffic efficiently and overseeing the accurate reconciliation of sales accounts.</p><p>Your hands-on experience will help keep counter and phone sales running smoothly and in line with procedures, while making sure all back orders are followed up until received.</p><p>You&rsquo;ll also be confident in maintaining quality assurance standards and committed to ensuring a safe, compliant working environment.</p>",Hours:"<p>Full time - Monday to Friday.</p>",Rates:"<p>Competitive base salary + super + various benefits & rewards.</p>",Requirements:"<p>You will have extensive spare parts experience and a strong track record in team leadership. Excellent people management, communication, and problem-solving skills are essential to motivate the team and ensure smooth operations.</p>",Advancement:"<p>Opportunities are endless. To name a few, Warehouse Manager / Product Support Rep / Transport & Logistics Manager / Parts Inventory & Logisitics Manager</p>"},{Category:"Parts and Warehouse",JobTitle:"Warehouse, Storeperson - Reman",Description:"<p>You will become part of our Warehouse team where you will play a critical role in managing 'Reverse Logistics,' which involves overseeing the return, recycling, or disposal of goods.</p><p>No two days are alike, you will work with the broader team and handle core returns from customers and branches as well as credit returns from internal and external customers. You will also work closely with Caterpillar to ensure all claims are lodged and rectified on time.</p><p>You have a strong team-oriented mindset, along with the ability to work collaboratively and independently. You will communicate at all levels and maintain a focus on safety standards and operational protocols.</p>",Hours:"<p>Full time - Monday to Friday.</p>",Rates:"<p>Above award hourly rate dependent on experience + overtime.</p>",Requirements:"<p>You, are customer focused and will bring your technical and effective communication skills. You are proficient in using various systems, with intermediate MS Office skills, and your strong attention to detail and time management abilities will enable you to effectively manage multiple tasks with accuracy.</p>",Advancement:"<p>Opportunities, are endless. To name a few &hellip; Team Leader / Warehouse Supervisor / Warehouse Manager / Parts Advisor.</p>"},{Category:"Parts and Warehouse",JobTitle:"Parts Advisor",Description:"<p>You will become part of our Operations team, where you will work on our parts counter to interpret and locate Cat parts for customers and Technicians. You will do this over the phone and in person, using a variety of digital and print resources.</p><p>You will be working with state-of-the-art technology and support services and be part of a dealer network that is one of the world&rsquo;s top 100 recognised brands.</p>",Hours:"<p>Full time with varied and flexible hours of work available.</p>",Rates:"<p>Competitive base salary + super + various benefits & rewards.</p>",Requirements:"<p>You will have a true passion for customer service, exceptional communication skills and have mechanical knowledge, or a background in the heavy machinery and/or automotive industry.</p><p>You will have experience in a similar role, excellent organisational skills with the ability to handle multiple tasks, as well as a willingness and desire to develop into a Cat Parts Specialist.</p>",Advancement:"<p>Opportunities are endless. To name a few &hellip; Parts Manager / Service Coordinator / Sales or Product Support Rep / Warehouse Manager / Parts Inventory & Logistics Manager.</p>"},{Category:"Parts and Warehouse",JobTitle:"Warehouse Supervisor / Manager",Description:"<p>You will become part of our Warehouse team where you will be responsible for overseeing daily warehouse operations, ensuring efficient receipt, storage, dispatch, and handling of parts. You will manage invoice and time sheet approvals, stock ordering, and drive safety practices.</p><p>You&rsquo;ll lead a high-performing team, mentoring them to meet KPIs, and providing training and induction to equip team members with the necessary skills for success.</p>",Hours:"<p>Full-time with varied and flexible hours of work available.</p>",Rates:"<p>Competitive base salary + super + various benefits & rewards.</p>",Requirements:"<p>You will have extensive warehouse experience and a strong track record in team leadership. Excellent people management, communication, and problem-solving skills are essential to motivate the team and ensure smooth operations.</p>",Advancement:"<p>Opportunities are endless. To name a few, Parts Manager / Parts Inventory & Procurement Manager / Transport & Logistics Manager.</p>"},{Category:"Product Support",JobTitle:"Product Support Sales Rep",Description:"<p>You will become part of our Product Support Sales team, where you will be face to face with customers growing sales of Cat parts and service solutions and advising them on equipment repair needs.</p><p>You conduct equipment inspections to identify sales opportunities and optimise current marketing programs to generate win-win scenarios.</p><p>Your goal will be to collaborate with other departments to create a positive, value-added experience that differentiates William Adams and the Cat product from the competition.</p>",Hours:"<p>Full time with varied and flexible hours of work available, predominantly on the road.</p>",Rates:"<p>Competitive base salary + commission + mobile phone + vehicle.</p>",Requirements:"<p>You will have a real hunger to grow product support sales, whilst showing a true passion for delivering long term customer success. Your strong relationship building skills will compliment your previous experience in a similar role and industry.</p><p>Your excellent written and verbal communication skills, along with your strong time management skills will ensure your success in this role.</p>",Advancement:"<p>Opportunities are endless. To name a few, Equipment Sales Rep / Parts Manager / Development & Purchasing Manager / Key Account Manager / Product Support Sales Manager / General Manager &ndash; Product Support Services.</p>"},{Category:"Product Support",JobTitle:"Product Support Sales Supervisor",Description:"<p>You will lead a team of Internal Sales Representatives, Product Specialists, and Claims Administration staff to drive growth in aftermarket parts and service sales. You will oversee sales channel development, manage loyalty and commission programs and collaborate with internal departments as well as Caterpillar to execute targeted marketing initiatives.</p>",Hours:"<p>Full time - Monday to Friday.</p>",Rates:"<p>Competitive base salary + super + various benefits & rewards.</p>",Requirements:"<p>To be successful in this role you will have strong leadership, sales, and customer service skills, with a solid understanding of Caterpillar parts, service operations, and aftermarket sales strategies.</p><p>You will be experienced in team management, marketing campaign execution, and working collaboratively across departments to drive revenue growth and customer satisfaction.</p>",Advancement:"<p>Opportunities are endless. To name a few, Sales Manager &ndash; Product Support / Equipment Sales Manager / General Manager Product Support.</p>"},{Category:"Product Support",JobTitle:"Key Account Manager - Product Support",Description:"<p>You will be responsible for managing and strengthening contacts with major customers, focusing on delivering exceptional aftersales support, ensuring maximum equipment uptime, and promoting product support solutions such as parts, service, and maintenance programs.</p><p>You will identify customer needs, provide tailored solutions, and drive business growth through customer satisfaction and operational excellence.</p>",Hours:"<p>Full time - Monday to Friday.</p>",Rates:"<p>Competitive base salary + super + various benefits & rewards.</p>",Requirements:"<p>A strong understanding of Caterpillar equipment and effective communication skills are essential to build strong customer relationships in this role.</p>",Advancement:"<p>Opportunities are endless. To name a few, Sales Manager - Product Support / Equipment Sales Manager / General Manager Product Support.</p>"},{Category:"Resident Field Service Trades Person",JobTitle:" Diesel Technician",Description:"<p>You will become part of our Operations team, where you will live and work autonomously in a regional location supporting our customers. You will manage your own day to day activities, while providing the diagnosis, servicing, and maintenance repair services for our customer&rsquo;s onsite Cat equipment and components.</p><p>You will be working with state-of-the-art technology and support services and be part of a dealer network that is one of the world&rsquo;s top 100 recognised brands.</p>",Hours:"<p>Full time with varied flexible roster options and hours available.</p>",Rates:"<p>Attractive hourly rate dependent on skill level and roster + overtime + leave loading + tool allowance + weekly Resident allowance (+ various other allowances for mine sites, after hours on call etc.) + mobile phone + vehicle.</p>",Requirements:"<p>You will be a qualified Diesel Technician with a positive, customer focused attitude.</p><p>You will have extensive experience working in the field on Cat machinery and be able to demonstrate your diagnostics and problem-solving skills. You will enjoy working autonomously and have the ability to manage your time and maximise efficiency.</p>",Advancement:"<p>Opportunities are endless. To name a few, Service Coordinator / Service Supervisor / Sales or Product Support Rep / Technical Communicator / Service Manager / Branch Manager.</p>"},{Category:"Sales",JobTitle:"Sales Rep",Description:"<p>You will become part of our Operations team where you will support our customers and Technicians, by coordinating services and repairs for our customers Cat equipment and components.</p><p>You will own the customer contact for all jobs from start to finish and work closely with the Service team to ensure smooth and efficient planning. You will provide quotations, schedule work, and manage invoicing.</p><p>Effective communication is critical, and your aim is to achieve customer satisfaction and value for money.</p>",Hours:"<p>Full time with varied and flexible hours of work available, predominantly on the road.</p>",Rates:"<p>Competitive base salary + commission + mobile phone+ vehicle.</p>",Requirements:"<p>You are driven and motivated with sales experience within this industry and you thrive on achieving targets and building long term relationships.</p><p>You are an excellent communicator who is commercially aware with strong negotiating and influencing skills.</p><p>You enjoy providing exceptional customer service and have the ability to build rapport with people quickly and naturally.</p>",Advancement:"<p>Opportunities are endless. To name a few, Key Account Manager / Equipment Sales Manager / Product Support Sales Manager / Sales Support Manager / Product Manager.</p>"},{Category:"Sales",JobTitle:"Equipment Sales",Description:"<p>You will become part of our passionate Equipment Sales team, where you will grow sales of Cat equipment and build relationships with an ever-expanding customer base via telephone.</p><p>Your goal will be to exceed the revenue/unit target relating to new and used equipment sales. You will achieve this by responding quickly to all sales leads and making CRM updates, including call planning, activity logging and customer updates.</p>",Hours:"<p>Full time with varied and flexible hours of work available.</p>",Rates:"<p>Competitive base salary + super + commission + mobile phone + various benefits & rewards.</p>",Requirements:"<p>You have a passion to work in the sales industry and a tenacious attitude that means you never give up. You enjoy providing exceptional customer service and have the ability to build rapport with people quickly and naturally.</p><p>Your excellent written and verbal communication skills, along with your strong time management skills will ensure your success in this role.</p>",Advancement:"<p>Opportunities are endless. To name a few, Product Support Sales Rep / Equipment Sales Manager / Product Support Sales Manager / General Manager - Sales.</p>"},{Category:"Sales",JobTitle:"Sales",Description:"<p>Our Sales team drive our sales efforts and expand our market presence across various sectors. They develop relationships with our customers aiming to increase revenue and build long-term partnerships. They negotiate contracts, close deals, address client needs, and maximise the value of high priority accounts.</p><p>They are a team of experienced, driven and motivated Sales professionals who thrive on achieving targets. They are product experts with excellent communication and negotiation skills and take a customer-centric approach.</p>",Roles:["Key Account Manager","Account Manager &ndash; Mining","Business Manager &ndash; Antarctica","Mining and Major Projects Manager","Senior Sales Engineer","Internal Sales Engineer","Attachment Specialist"]},{Category:"Sales Support",JobTitle:"Sales Support",Description:"<p>You will become part of our Sales team acting as the behind the scenes engine that keeps the sales process running efficiently and ensuring smooth communication with our customers. This critical support allows the sales specialists to maximise their effectiveness and achieve sales goals.</p><p>Handling administrative, operational, and technical tasks, including preparing quotes, proposals, maintaining customer data, as well as conducting market research and competitor analysis.</p>",Roles:["Sales Admin Supervisor","Sales Systems Manager","Sales Analyst","Sales Administration Coordinator"]},{Category:"Product Support",JobTitle:"Product Support",Description:"<p>You will become part of our Product Support team, where you will establish and maintain contact with small to medium-sized customers via telephone, to increase customer loyalty and sales of parts and service solutions.</p><p>You will respond quickly to all sales leads and make CRM updates, including call planning, activity logging and customer updates, all while growing sales and building strong relationships.</p>",Hours:"<p>Full time with varied and flexible hours of work available.</p>",Rates:"<p>Competitive base salary + super + various benefits & rewards.</p>",Requirements:"<p>You have a passion to work in the sales industry and a tenacious attitude that means you never give up. You enjoy providing exceptional customer service and have the ability to build rapport with people quickly and naturally.</p><p>Your excellent written and verbal communication skills, along with your strong time management skills will ensure your success in this role.</p>",Advancement:"<p>Opportunities are endless. To name a few, Product Support Sales Rep / Service Coordinator / Equipment Sales Rep / Parts Development & Purchasing Manager / Product Support Sales Manager.</p>"},{Category:"Supervisor/Service Manager",JobTitle:"Supervisor",Description:"You will become part of our Operations team where you will be responsible for leading our hard-working Workshop and Field Service teams. You will ensure all KPIs are achieved and more importantly our customers have a positive experience each time they do business with us. </p><p>You will drive and maintain safety and contamination control awareness, all while multitasking with your excellent organisational skills.",Hours:"<p>Full time with varied and flexible hours of work available.</p>",Rates:"<p>Competitive base salary + super + mobile phone + various benefits & rewards.</p>",Requirements:"<p>You will be a strong communicator with experience working under pressure and have proven conflict resolution abilities.</p><p>Your drive and passion to deliver first class customer service, along with your strong time management skills will ensure your success in this role. You will ideally have experience or exposure to working in the heavy machinery or automotive industry and be able to demonstrate your diagnostics and problem-solving skills.</p>",Advancement:"<p>Supervisor / Sales or Product Support Rep / Service Manager / Product Support Manager &ndash; Metro Field Service / Branch Manager.</p>"},{Category:"Team Leader",JobTitle:"Team Leader",Description:"You will become part of our Operations team, where you will lead, coach and develop an assigned team of trades people. This is a hands-on role where you will supervise the workmanship and performance of the team while driving safety awareness.</p><p>Your goal will be to collaborate with key team members to manage the flow of work and resources, to ensure quality outputs to meet customer expectations.",Hours:"<p>Full time with varied and flexible hours of work available.</p>",Rates:"<p>Competitive base salary + super + mobile phone + various benefits & rewards.</p>",Requirements:"<p>You are a qualified Diesel Technician, ideally with previous supervisory experience, or you have natural leadership tendencies. You are a strong communicator and have the ability to effectively liaise with customers, peers, and all levels of management.</p><p>Your excellent organisational skills and capacity to handle several tasks simultaneously, along with your solid computer skills will ensure your success in this role.</p>",Advancement:"<p>Opportunities are endless. To name a few, Service Supervisor, WIP Room Coordinator / Service Manager / Product Support Sales Rep / Equipment Sales Manager / Product Support Sales Manager.</p>"},{Category:"Technical Trainer",JobTitle:"Technical Trainer",Description:"<p>You will become part of our Learning and Development Team, where you will deliver machine, technical systems and safety training to our team and customers.</p><p>You will assess training needs, design content, and plan and deliver interactive courses on a broad range of equipment and technology. </p><p>Partnering closely with our managers you will plan relevant, timely and effective training, as well as conducting skills gap analysis to identify training opportunities.</p>",Hours:"<p>Full time with varied and flexible hours of work available, including regular travel.</p>",Rates:"<p>Competitive base salary + super + mobile phone + various benefits & rewards. </p>",Requirements:"<p>You will require either a mechanical trade qualification or equivalent technical experience. You are a natural and engaging communicator who thrives on training and developing people. A Cert IV in Training and Assessment or higher would be advantageous.</p>",Advancement:"<p>Opportunities are endless. To name a few &hellip; Operator Trainer or Technical Training Manager. You may also want to consider moving across into other areas of People & Culture or into other leadership roles in Operations or Product Support.</p>"},{Category:"Workshop Trades Person",JobTitle:"Diesel Technician",Description:"<p>You will become part of our Operations team, where you will work with the best, in the servicing and maintenance of a massive range of Cat equipment and components.</p><p>You will have the opportunity to troubleshoot and diagnose some of the most technologically advanced machines. Working with state-of-the-art technology and support services and being part of a dealer network that is one of the world&rsquo;s top 100 recognised brands.</p>",Hours:"<p>Full time with varied flexible roster options and hours available.</p>",Rates:"<p>Attractive hourly rate dependent on skill level and roster + overtime + leave loading + tool allowance.</p>",Requirements:"<p>You will be a qualified Diesel Technician with a positive, customer focused attitude. You will ideally have experience working with Cat machinery and be able to demonstrate your diagnostics and problem-solving skills.</p><p>Your positive attitude towards safety, excellent communication skills (both written and verbal) and your commitment to the job will not only see you succeed but thrive in our business.</p>",Advancement:"<p>Opportunities are endless. To name a few, Dual Trade Auto Electrician / Field Service Diesel Technician / Supervisor / Technical Trainer / Sales or Product Support Rep / Technical Communicator / Branch Manager.</p>"},{Category:"Workshop Trades Person",JobTitle:"Auto Electrician",Description:"<p>You will become part of our Operations team, where you will work with the best in the diagnosis, servicing, and maintenance of electrical and air conditioning systems on a massive range of Cat equipment.</p><p>You will work with state-of-the-art technology and support services and be part of a dealer network that is one of the world&rsquo;s top 100 recognised brands.</p>",Hours:"<p>Full time with varied flexible roster options and hours available.</p>",Rates:"<p>Attractive hourly rate dependent on skill level and roster + overtime + leave loading + tool allowance.</p>",Requirements:"<p>You will be a qualified Auto Electrician with a proactive, customer focused attitude. You will ideally have experience working with Cat machinery and be able to demonstrate your electrical diagnostics and problem-solving skills. Your positive attitude towards safety, excellent communication skills (both written and verbal) and your commitment to the job will not only see you succeed but thrive in our busines</p>",Advancement:"<p></p>"},{Category:"Workshop Trades Person",JobTitle:"Hydraulic Cylinder Technician",Description:"<p>You will become part of our Operations team and will focus on the inspection and repairs of hydraulic cylinder components. You will disassemble, inspect and repair hydraulic cylinders, small pumps, hydraulic motors, valves and small drive components.</p><p>You will be working with state-of-the-art technology and support services and be part of a dealer network that is one of the world&rsquo;s top 100 recognised brands.</p>",Hours:"<p>Full time - Monday to Friday.</p>",Rates:"<p>Above award hourly rate dependent on skill & experience + overtime + leave loading.</p>",Requirements:"<p>You, will have previous experience in a workshop environment, ideally heavy machinery, engineering or automotive. Hydraulic Cylinder experience and a mechanical trade qualification is preferred, however, not essential.</p>",Advancement:"<p>Opportunities, are endless. To name a few &hellip; Team Leader / Supervisor / Service Coordinator / Branch Manager.</p>"},{Category:"Workshop Trades Person",JobTitle:"Boilermaker",Description:"<p>You will become part of our Operations team, where you will work with the best, in heavy fabrication and welding work on a massive range of Cat equipment and components. You will work with state-of-the-art technology and support services and be part of a dealer network that is one of the world&rsquo;s top 100 recognised brands.</p>",Hours:"<p>Full time with varied flexible roster options and hours available.</p>",Rates:"<p>Attractive hourly rate dependent on skill level and roster + overtime + leave loading + tool allowance.</p>",Requirements:"<p>You will be a qualified Boilermaker with a positive, customer focused attitude. You will have impeccable attention to detail, be able to demonstrate your first-class welding skills, and ideally have experience working with heavy machinery.</p><p>Your positive attitude towards safety, excellent communication skills (both written and verbal) and your commitment to the job will not only see you succeed but thrive in our business.</p>",Advancement:"<p>Opportunities are endless. To name a few &hellip; Dual Trade Diesel Technician / Field Service Diesel Technician / Team Leader / Parts Advisor / Sales or Product Support Rep / Branch Manager</p>"},{Category:"Workshop Trades Person",JobTitle:"Machinist",Description:"<p>You will become part of our Operations team, where you will work with the best in machining, using a broad range of CNC and other types of machinery. You will recondition a range of components as per Caterpillar reuse and salvage guidelines to keep rebuild and operation costs down for our customers.</p><p>Working with state-of-the-art technology and support services and being part of a dealer network that is one of the world&rsquo;s top 100 recognised brands. </p>",Hours:"<p>Full time Monday to Friday (5x2) 7:30am-4:00pm or 6:30am-3:00pm.</p>",Rates:"<p>Attractive hourly rate dependent on skill level and roster + overtime + leave loading + tool allowance. </p>",Requirements:"<p>You will be a qualified Machinist with a positive, customer focused attitude. You will have experience working with heavy both manual and CNC lathe & Milling machinery (Engine reconditioning experience is preferred but not essential).</p> <p>Your high attention to detail, positive attitude towards safety, excellent communication skills (both written and verbal) and your commitment to the job will not only see you succeed but thrive in our business.</p>",Advancement:"<p>Opportunities are endless. To name a few &hellip; Dual Trade Diesel Technician or Boilermaker / Team Leader / Parts Advisor / Product Support Rep / Branch Manager</p>"},{Category:"Workshop Trades Person",JobTitle:"Tool Store Person",Description:"<p>You will become part of our workshop support team where you will be responsible for managing the day-to-day operations of the tool store. This will include issuing and receiving tooling, maintaining accurate inventory records, coordinating repairs and calibrations, and ensuring all tooling is in safe, working condition.</p><p>You will work closely with our technicians to support their tooling needs for a wide range of jobs, helping to keep the workshop running efficiently. A proactive and organised approach, along with strong communication skills, will be key to your success in this role.</p><p>You will be working with state-of-the-art technology and support services and be part of a dealer network that is one of the world&rsquo;s top 100 recognised brands.</p>",Hours:"<p>Full time with varied flexible roster options and hours available.</p>",Rates:"<p>Above award hourly rate dependent on skill & experience + overtime + leave loading.</p>",Requirements:"<p>To be successful in this role, you will have previous experience in a storeperson or tooling role, ideally within a mechanical or workshop environment. You&rsquo;ll bring strong attention to detail, a customer-focused mindset, and solid computer and inventory management skills.</p>",Advancement:"<p>Opportunities are endless. To name a few, Parts Advisor / Parts Supervisor / Service Coordinator / Internal Sales Rep.</p>"},{Category:"Workshop Trades Person",JobTitle:"Yard Person",Description:"<p>You will become part of our operations team where you will be responsible for maintaining a clean, organised and efficient yard environment. This will include moving equipment and machinery, assisting with loading and unloading, general cleaning duties, and supporting the workshop team as needed.</p><p>You will safely operate machinery such as forklifts and use correct manual handling techniques, while following all safety procedures to ensure a safe and productive worksite.</p><p>You will be working with state-of-the-art technology and support services and be part of a dealer network that is one of the world&rsquo;s top 100 recognised brands.</p>",Hours:"<p>Full time with varied flexible roster options and hours available.</p>",Rates:"<p>Above award hourly rate dependent on skill & experience + overtime + leave loading.</p>",Requirements:"<p>To be successful in this role, you will have a strong work ethic, good organisational skills and a commitment to safety. A forklift licence and experience working in a yard or similar environment will be highly regarded.</p>",Advancement:"<p>Opportunities are endless. To name a few, Storeperson / Trades Assistant / Parts Advisor / Service Coordinator.</p>"},{Category:"Workshop Trades Person",JobTitle:"Spray Painter",Description:"<p>You will become part of our Operations team where you will be responsible for preparing and painting a range of Caterpillar machines and components to a high standard. This will include surface preparation, masking, colour mixing, and applying paint finishes using spray equipment.</p><p>You will follow all safety procedures and use the correct tools and techniques to deliver quality finishes, while maintaining a clean and organised work area. Your attention to detail and commitment to workmanship will help ensure our machines look as good as they perform.</p><p>You will be working with state-of-the-art technology and support services and be part of a dealer network that is one of the world&rsquo;s top 100 recognised brands.</p>",Hours:"<p>Full time with varied flexible roster options and hours available.</p>",Rates:"<p>Above award hourly rate dependent on skill & experience + overtime + leave loading.</p>",Requirements:"<p>You will have previous spray-painting experience, ideally in automotive or heavy equipment. You will also bring strong attention to detail, a focus on safety, and the ability to work both independently and as part of a team.</p>",Advancement:"<p>Opportunities are endless. To name a few, Team Leader / Supervisor / Service Coordinator / Branch Manager</p>"},{Category:"Workshop Trades Person",JobTitle:"Trades Assistant",Description:"<p>You will become part of our workshop team where you will be responsible for a range of support duties aimed at assisting our technicians and ensuring the smooth operation of the workshop. This will include preparing and cleaning parts, organising tools and equipment, assisting with mechanical tasks, and helping with general workshop duties.</p><p>You will follow safe work practices and contribute to maintaining a clean, organised, and efficient work environment, while developing your skills and gaining valuable experience in heavy equipment service and repair.</p><p>You will be working with state-of-the-art technology and support service
